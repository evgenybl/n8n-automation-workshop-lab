name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiments:
    name: n8n experiments (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 24
      - name: Start n8n and the practice office
        run: docker compose up -d
      - name: Load every workflow
        run: node tools/load.js
      - name: Run the experiments
        run: node experiments/run.js
      - name: The office's log
        if: always()
        run: docker compose logs office 2>&1 | tail -40
      - name: n8n's log
        if: always()
        run: docker compose logs n8n 2>&1 | tail -150
