name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: The lab on Linux, with n8n
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 24

      - name: The office's tests and the other tests that need no container
        run: node --test --test-reporter=tap "practice/tests/*.test.js" "tests/*.test.js" | tee "$RUNNER_TEMP/local-tap.txt"

      - name: The static checks of every workflow file
        run: node tools/check-workflows.js

      - name: Every workflow file is what the generator writes
        run: node tools/build-workflows.js --check

      - name: Every picture is drawn again and compared with its file
        run: node tools/draw-workflow.js --check

      - name: The repairs page for printing is what its script writes from the participant page
        run: node tools/print-repairs.js --check

      - name: Start n8n and the practice office, as the compose file starts them
        run: |
          docker compose version
          docker compose up -d
          docker compose ps

      - name: The n8n image this run used (its digest, size and platforms, for the setup page)
        run: |
          docker image inspect docker.n8n.io/n8nio/n8n:2.48.8 --format 'digest {{index .RepoDigests 0}}'
          docker image inspect docker.n8n.io/n8nio/n8n:2.48.8 --format 'size on disk {{.Size}} bytes'
          docker buildx imagetools inspect docker.n8n.io/n8nio/n8n:2.48.8 | grep -E 'Platform:' | sort -u || echo "no platforms listed"
          docker manifest inspect --verbose docker.n8n.io/n8nio/n8n:2.48.8 > "$RUNNER_TEMP/manifest.json" || echo "could not read the manifest"
          node -e "const m=[].concat(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')));for(const e of m){const p=e.Descriptor&&e.Descriptor.platform;const v=e.OCIManifest||e.SchemaV2Manifest;if(!p||!v||p.os==='unknown')continue;const l=v.layers||[];console.log('download for '+p.os+'/'+p.architecture+': '+l.reduce((s,x)=>s+x.size,0)+' bytes in '+l.length+' layers')}" "$RUNNER_TEMP/manifest.json" || echo "could not add up the layers"
          docker info | grep -E '^Server:|Server Version:' || echo "docker info printed no such lines"

      - name: What starting the lab prints in a folder without compose.yaml (for the setup page)
        run: |
          mkdir -p "$RUNNER_TEMP/not-the-lab"
          cd "$RUNNER_TEMP/not-the-lab"
          docker compose up -d 2>&1 || true

      - name: Load and publish every workflow file
        run: node tools/load.js --all

      - name: Every scenario, through the published webhooks
        env:
          LAB_LIVE: "1"
        run: node --test --test-reporter=tap tests/scenarios.test.js | tee "$RUNNER_TEMP/scenario-tap.txt"

      - name: The instructor's preparation, as the run sheet gives it, leaves the participants' paths free
        run: |
          node tools/load.js --clear
          node tools/load.js --solutions

      - name: The test summaries pasted on the testing page are the ones this run printed
        run: |
          node tools/check-pasted.js "$RUNNER_TEMP/local-tap.txt" docs/HOW-THIS-WAS-TESTED.md local
          node tools/check-pasted.js "$RUNNER_TEMP/scenario-tap.txt" docs/HOW-THIS-WAS-TESTED.md ci

      - name: The logs, when something failed
        if: failure()
        run: |
          docker compose logs office 2>&1 | tail -60
          docker compose logs n8n 2>&1 | tail -200

  windows:
    name: What needs no container, on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 24

      - name: The office's tests and the other tests that need no container
        run: node --test --test-reporter=tap "practice/tests/*.test.js" "tests/*.test.js" | tee "$RUNNER_TEMP/local-tap.txt"

      - name: The static checks of every workflow file
        run: node tools/check-workflows.js

      - name: The picture tool, compared with every picture
        run: node tools/draw-workflow.js --check

      - name: The repairs page for printing, compared with what its script writes
        run: node tools/print-repairs.js --check

      - name: The local test summary pasted on the testing page is the one this run printed
        run: node tools/check-pasted.js "$RUNNER_TEMP/local-tap.txt" docs/HOW-THIS-WAS-TESTED.md local
